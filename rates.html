<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Baba Shyam Jewellers</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,600&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="./images/gold/logo.png">
    <link rel="apple-touch-icon" href="./images/gold/logo.png">
</head>

<body>
    <div class="page-hero">
        <div class="kick">Delhi Market</div>
        <h1>Gold &amp; Silver Rates</h1>
        <p>Retail rates per gram, inclusive of import duty &amp; GST.</p>
        <div class="orn">◆</div>
    </div>
    <section>
        <div class="rg rv">
            <div class="rc ">
                <div class="m">Gold</div>
                <h3>24K</h3>
                <div class="pv" id="gold24"></div>
                <div class="ch" id="c_gold24"></div><small>per gram (INR)</small>
            </div>
            <div class="rc ">
                <div class="m">Gold</div>
                <h3>22K</h3>
                <div class="pv" id="gold22"></div>
                <div class="ch" id="c_gold22"></div><small>per gram (INR)</small>
            </div>
            <div class="rc ">
                <div class="m">Gold</div>
                <h3>18K</h3>
                <div class="pv" id="gold18"></div>
                <div class="ch" id="c_gold18"></div><small>per gram (INR)</small>
            </div>
            <div class="rc sv">
                <div class="m">Silver</div>
                <h3>999 Fine</h3>
                <div class="pv" id="silver"></div>
                <div class="ch" id="c_silver"></div><small>per gram (INR)</small>
            </div>
        </div>
        <p class="upd"><span class="dot"></span><span id="upd"></span></p>
    </section>
  
    <script src="app.js"></script>
</body>

</html>
